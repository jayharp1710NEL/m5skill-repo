<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="module"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">Instagram</h1>
            <div class="header-icons">
                <button class="icon-button" aria-label="Notifications">
                    <svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.6A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8 2.6c0 6-8 10.6-8 10.6z"/></svg>
                </button>
                <button class="icon-button" aria-label="Messages">
                    <svg viewBox="0 0 24 24"><path d="M21 3 3 10l7.5 3L21 3l-10.5 10L14 21z"/></svg>
                </button>
            </div>
        </header>

        <main class="feed"></main>
    </div>
</body>
</html>
